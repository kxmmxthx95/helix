<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helix · Twilight forest study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17262b;color:#e6eee2;font:14px system-ui;height:100dvh;display:flex;flex-direction:column}header{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #3e5655;background:#1b3033}h1{font-size:18px;margin:0 auto 0 0}h1 small{display:block;font-size:11px;font-weight:400;letter-spacing:.12em;color:#a4c0a7;margin-top:3px}button,select{font:inherit;background:#2b4548;color:inherit;border:1px solid #64807a;border-radius:6px;padding:8px;cursor:pointer;min-height:40px}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid #ffdf85;outline-offset:3px}button[aria-pressed=true]{background:#52683f;border-color:#a8bf82}main{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#263b39,#17262b 75%);overscroll-behavior:contain}main.zoomed{display:block;padding:12px}canvas{image-rendering:pixelated;max-width:none;flex:none;cursor:crosshair}main.zoomed canvas{cursor:grab;touch-action:none;display:block;margin:auto}main.zoomed canvas:active{cursor:grabbing}footer{flex:none;padding:10px 20px;border-top:1px solid #344c4c;font-size:12px;color:#aec6bb;display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}#info{color:#d4e2cc}#view-status{color:#efd69a;white-space:nowrap}.note{margin-top:3px;font-size:11px;max-width:760px}@media(max-width:600px){header{padding:10px 12px;gap:7px}h1{width:100%;font-size:16px}h1 small{display:inline;margin-left:8px;font-size:9px}button,select{font-size:12px;padding:7px;min-height:38px}footer{padding:8px 12px;gap:4px;font-size:11px}.note{font-size:10px}main{background:#1b2e30}}
</style></head><body>
<header><h1>ป่าสนธยา <small>FOREST DIORAMA / 03</small></h1>
<select id="mode" aria-label="รูปแบบพื้น"><option value="scene">ป่า · สะพานรากไม้ · วิหาร</option><option value="grass_plain">ทดสอบต่อหญ้า</option><option value="dirt_rocks_01">ทดสอบต่อทางดิน</option><option value="stone_floor_01">ทดสอบต่อหิน</option><option value="water_01">ทดสอบต่อน้ำ</option></select>
<button id="grid" aria-pressed="false">กริด</button><button id="decor" aria-pressed="true">ของตกแต่ง</button>
<select id="scale" aria-label="ขนาดแสดงผล"><option value="fit">พอดีจอ</option><option value="1">1× พิกเซลจริง</option><option value="2">2×</option></select></header>
<main aria-label="พื้นที่เลื่อนดูฉาก"><canvas id="map" tabindex="0" aria-label="ฉากทดลองป่าพิกเซล คลิกตรวจช่อง เลือก 1 เท่าหรือ 2 เท่าแล้วลากเพื่อดูรายละเอียด"></canvas></main>
<footer><div><div id="info" role="status">กำลังโหลด…</div><div class="note">ฉากแยกจาก /map · คลิกตรวจช่อง · 1× / 2× แล้วลากดู · สไปรต์เดิม + หินวิหารจำลองแบบแยกชิ้น ไม่ใช่ภาพอ้างอิงแปะพื้นหลัง</div></div><span id="view-status"></span></footer>
<script type="module" src="/src/prototypes/pixel-tiles/preview.js"></script></body></html>
