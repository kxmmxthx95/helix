<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helix · Pixel tile study</title><style>*{box-sizing:border-box}body{margin:0;background:#17262b;color:#e6eee2;font:14px system-ui}header{padding:16px 22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #46605c}h1{font-size:19px;margin:0 auto 0 0}button,select{background:#2b4548;color:inherit;border:1px solid #64807a;border-radius:7px;padding:8px;cursor:pointer}main{overflow:auto;height:calc(100dvh - 130px);display:grid;place-items:start center}canvas{image-rendering:pixelated;max-width:none;cursor:crosshair}footer{padding:10px 22px;color:#aec6bb}#info{min-height:20px}button[aria-pressed=true]{background:#6b6a33}</style></head><body><header><h1>ฉากทดลอง · Twilight pixel tiles</h1><select id="mode" aria-label="รูปแบบพื้น"><option value="scene">ป่า ทางดิน และลานวิหาร</option><option value="grass_plain">ทดสอบต่อหญ้า</option><option value="dirt_rocks_01">ทดสอบต่อทางดิน</option><option value="stone_floor_01">ทดสอบต่อหิน</option><option value="water_01">ทดสอบต่อน้ำ</option></select><button id="grid" aria-pressed="false">แสดงกริด</button><select id="scale" aria-label="ขนาดแสดงผล"><option value="1">1×</option><option value="2">2×</option></select></header><main><canvas id="map" aria-label="ฉากทดสอบกระเบื้องพิกเซล"></canvas></main><footer><div id="info">กำลังโหลด…</div>ตัวอย่างแยกจาก /map · คลิกแผ่นพื้นเพื่อตรวจตำแหน่ง · เส้นขอบและลายซ้ำยังต้องปรับแต่ง</footer><script type="module" src="./baseline-preview.js"></script></body></html>
