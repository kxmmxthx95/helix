<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Helix" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <!-- Geist (Latin) and Noto Sans Thai are self-hosted: no network round-trip before first paint, and the service worker precaches them. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Geist-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/NotoSansThai-thai.woff2" />
    <!-- Rarely used families (game, mono, print): loaded without blocking first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Mali:wght@600;700&family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Helix - PMV : ระบบจัดการโรงเรียนปิยมิตรวิทยา</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Opened from the POS sign-in or the POS itself: install as its own "Helix POS" app (public/pos.webmanifest).
      if (/^\/(pos-login|card-topup)/.test(location.pathname)) {
        var m = document.querySelector('link[rel="manifest"]');
        if (m) m.setAttribute("href", "/pos.webmanifest");
        var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (t) t.setAttribute("content", "Helix POS");
      }
    </script>
  </body>
</html>
