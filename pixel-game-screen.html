<style>
*{box-sizing:border-box}body{margin:0;background:#173b32;color:#eef3dd;font:14px system-ui}main{position:fixed;inset:0;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}button,a{font:inherit;color:inherit}button{min-height:44px;min-width:44px;border:1px solid #9fb99c70;background:#203e35;border-radius:8px;cursor:pointer;padding:8px 12px}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #ffe8a1;outline-offset:3px}button[aria-current=true]{background:#9db56b;color:#122a25;border-color:#dce9ad}.panel{background:#112b26ed;border:1px solid #aec09260;border-radius:12px;box-shadow:0 8px 24px #071b2360;backdrop-filter:blur(6px)}header{position:fixed;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));padding:12px 16px;max-width:calc(100% - 32px)}h1{font-size:18px;margin:0;letter-spacing:.03em}header small{font-size:10px;letter-spacing:.14em;color:#c6d7af}header p{margin:4px 0 0;font-size:11px;color:#b5cbb9}nav{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:10px 12px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px)}#stage-title{font-size:12px;text-align:center;min-width:125px;margin:0 2px 5px}#numbers{display:flex;gap:5px;justify-content:center}#numbers button{min-height:32px;min-width:32px;padding:3px}#sample{position:fixed;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));padding:10px 14px;max-width:270px;font-size:12px}summary{cursor:pointer;min-height:24px}details p{line-height:1.6;color:#bed0bd}#fullscreen{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom))}#loading{position:fixed;inset:45% 0 auto;text-align:center;pointer-events:none}a{color:#d5e9ad}#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){header{padding:9px 12px;top:max(10px,env(safe-area-inset-top));left:10px}h1{font-size:16px}header p{font-size:10px}#sample{top:max(10px,env(safe-area-inset-top));right:10px;max-width:145px;padding:8px;font-size:10px}#sample[open]{max-width:calc(100% - 20px);z-index:3}#fullscreen{display:none}nav{bottom:max(12px,env(safe-area-inset-bottom));gap:6px;padding:8px}#stage-title{min-width:130px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
