<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix · Overgrown city scene (detached prototype)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#9fd3ee;font:14px system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:12px;right:12px;bottom:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;pointer-events:none}
.hud>*{pointer-events:auto}
button{border:2px solid #fff;background:rgba(40,70,40,.78);color:#fff;border-radius:999px;padding:9px 16px;font:600 14px system-ui;cursor:pointer;backdrop-filter:blur(4px)}
button[aria-pressed=true]{background:#e9a23b;color:#2b1d05}
#card{position:fixed;left:12px;top:12px;max-width:290px;background:rgba(255,255,255,.9);border-radius:14px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.22);font-size:13px;color:#233}
#card b{display:block;font-size:15px;margin-bottom:2px}
#status{position:fixed;right:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
@media(max-width:600px){#card{max-width:62vw}}
</style></head><body>
<div id="stage"></div>
<div id="card"><b id="title">…</b><span id="desc">กำลังโหลดโมเดล</span></div>
<div id="status">Loading…</div>
<div class="hud"><button id="prev">‹ ก่อนหน้า</button><span id="dots"></span><button id="next">ถัดไป ›</button></div>
<script type="module" src="/src/prototypes/overgrown/scene.js"></script>
</body></html>
